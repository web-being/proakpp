<section id="gallery" class="section--gallery">

	<div class="swiper-container section-gallery">
		<div class="swiper-wrapper">
			<div class="swiper-slide section-gallery-item">
				<img class="section-gallery-item-image" alt="Автоматическая коробка передач в разрезе" src="assets/transmission-1.webp"/>
			</div>
			<div class="swiper-slide section-gallery-item">
				<img class="section-gallery-item-image" alt="Гидротрансформатор и планетарные ряды АКПП в разрезе" src="assets/transmission-2.webp"/>
			</div>
			<div class="swiper-slide section-gallery-item">
				<img class="section-gallery-item-image" alt="АКПП в разрезе: пакеты фрикционов и валы" src="assets/transmission-3.webp"/>
			</div>
			<div class="swiper-slide section-gallery-item">
				<img class="section-gallery-item-image" alt="Узел автоматической коробки передач крупным планом" src="assets/transmission-4.webp"/>
			</div>
			<div class="swiper-slide section-gallery-item">
				<img class="section-gallery-item-image" alt="Автоматическая коробка передач в разрезе, вид сбоку" src="assets/transmission-5.webp"/>
			</div>
		</div>
	</div>

	<script type="text/javascript">
		window.addEventListener('load', function () {
			var mySwiper = new Swiper ('.section-gallery', {
				slidesPerView: 'auto',
				loop: true,
				nextButton: '.section-gallery .swiper-button-next',
				prevButton: '.section-gallery .swiper-button-prev',
				paginationClickable: true,
				spaceBetween: 0,
				centeredSlides: true
			})
			wheel(mySwiper)
		})
	</script>
</section>
