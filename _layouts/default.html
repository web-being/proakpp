<!doctype html>
{% assign lang=page.lang | default: 'ru' %}
<html lang="{{ lang }}">

	{% include head.html %}

	<script src="{{ '/assets/zenscroll.js' | prepend: site.baseurl }}" async defer></script>
	<script src="{{ "/assets/aos.js" | prepend: site.baseurl }}" defer></script>

	<body class="page {{ layout.type }}">
		{% include header.html %}

		<main class="site-content">
			{{ content }}
		</main>

		{% include footer.html %}

	</body>

	<script type="text/javascript">
		document.addEventListener('DOMContentLoaded', function () {
			AOS.init({ once: true, offset: 40 })
		})
	</script>

	<link rel="stylesheet" href="{{ "/assets/normalize.css" | prepend: site.baseurl }}">
	<link rel="stylesheet" href="{{ "/assets/index.css" | prepend: site.baseurl }}">

	<link rel="stylesheet" href="{{ "/assets/font-awesome.css" | prepend: site.baseurl }}">
	<link rel="stylesheet" href="{{ "/assets/swiper.css" | prepend: site.baseurl }}">


	<script src="{{ "/assets/swiper.js" | prepend: site.baseurl }}" async defer></script>
</html>
